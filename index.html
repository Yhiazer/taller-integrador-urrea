<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Promedio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cont1">
        <h1>Calculadora de Promedio</h1>
        <p>Ingrese las tres notas del corte para calcular el promedio.</p>

        <label>Nota 1:</label>
        <input type="number" id="n1" step="0.1">

        <label>Nota 2:</label>
        <input type="number" id="n2" step="0.1">

        <label>Nota 3:</label>
        <input type="number" id="n3" step="0.1">

        <button onclick="calcularPromedio()">Calcular</button>

        <p id="r"></p>
        <p id="r2"></p>
    </div>

<script>

let promedio = 0;
let CANTIDAD_NOTAS = 3;

function calcularPromedio() {

    let nota1 = parseFloat(document.getElementById("n1").value);
    let nota2 = parseFloat(document.getElementById("n2").value);
    let nota3 = parseFloat(document.getElementById("n3").value);


    if (isNaN(nota1) || isNaN(nota2) || isNaN(nota3)) {
        document.getElementById("r").innerHTML = "Debe ingresar las tres notas.";
        return;
    }

    promedio = (nota1 + nota2 + nota3) / CANTIDAD_NOTAS;

    document.getElementById("r").innerHTML = "Promedio: " + promedio.toFiCANTIDAD_NOTASed(2);

    if (promedio >= 3.0) {
        document.getElementById("r2").innerHTML = "Resultado: aprobado";
    } else {
        document.getElementById("r2").innerHTML = "Resultado: reprobado";
    }

}

// function calcularAntiguo(nota1, nota2) {
//     let suma = nota1 + nota2;
//     return suma / 2;
// }

</script>

</body>
</html>
