<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Promedio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cont1">
        <h1>Calculadora de Promedio</h1>
        <p>Ingrese las tres notas del corte para calcular el promedio.</p>

        <label>Nota 1:</label>
        <input type="number" id="nota-1" step="0.1">

        <label>Nota 2:</label>
        <input type="number" id="nota-2" step="0.1">

        <label>Nota 3:</label>
        <input type="number" id="nota-3" step="0.1">

        <button onclick="calcularPromedio()">Calcular</button>

        <p id="texto-respuesta"></p>
        <p id="texto-resultado"></p>
    </div>

<script>

let promedio = 0;
let CANTIDAD_NOTAS = 3;

function calcularPromedio() {

    let nota1 = parseFloat(document.getElementById("nota-1").value);
    let nota2 = parseFloat(document.getElementById("nota-2").value);
    let nota3 = parseFloat(document.getElementById("nota-3").value);


    if (isNaN(nota1) || isNaN(nota2) || isNaN(nota3)) {
        document.getElementById("texto-respuesta").innerHTML = "Debe ingresar las tres notas.";
        return;
    }

    promedio = (nota1 + nota2 + nota3) / CANTIDAD_NOTAS;

    document.getElementById("texto-respuesta").innerHTML = "Promedio: " + promedio.toFixed(2);

    if (promedio >= 3.0) {
        document.getElementById("texto-resultado").innerHTML = "Resultado: aprobado";
    } else {
        document.getElementById("texto-resultado").innerHTML = "Resultado: reprobado";
    }

}

</script>

</body>
</html>
